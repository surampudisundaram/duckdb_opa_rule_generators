    <!-- Set base path for GitHub Pages subdirectory -->
    <script>
      if (!window.__VITE_PUBLIC_PATH__) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const isGitHubPages = pathSegments.includes('duckdb_opa_rule_generators');
        window.__VITE_PUBLIC_PATH__ = isGitHubPages ? '/duckdb_opa_rule_generators/' : '/';
        const base = document.createElement('base');
        base.href = window.__VITE_PUBLIC_PATH__;
        document.head.insertBefore(base, document.head.firstChild);
      }
    </script>
